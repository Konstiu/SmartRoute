<ion-header>
  <ion-toolbar>
    <ion-title class="ion-text-center">Login</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="login-container">
    <div class="logo-container">
      <img src="assets/logo.png" alt="SmartRoute Logo" class="app-logo">
      <h2 class="app-name">SmartRoute</h2>
      <h1>Welcome Back</h1>
      <p>Sign in to continue</p>
    </div>

    <form [formGroup]="loginForm" (ngSubmit)="login()">
      <ion-item lines="full">
        <ion-input
          labelPlacement="floating"
          type="email"
          formControlName="email"
          autocomplete="email">
          <div slot="label">Email</div>
        </ion-input>
      </ion-item>
      <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
        <ion-text color="danger">
          <small *ngIf="loginForm.get('email')?.errors?.['required']">Email is required</small>
          <small *ngIf="loginForm.get('email')?.errors?.['email']">Invalid email format</small>
        </ion-text>
      </div>

      <ion-item lines="full" class="password-item">
        <ion-input
          labelPlacement="floating"
          [type]="showPassword ? 'text' : 'password'"
          formControlName="password"
          autocomplete="current-password">
          <div slot="label">Password</div>
        </ion-input>
        <ion-icon
          slot="end"
          [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"
          (click)="togglePasswordVisibility()"
          class="password-icon">
        </ion-icon>
      </ion-item>
      <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
        <ion-text color="danger">
          <small *ngIf="loginForm.get('password')?.errors?.['required']">Password is required</small>
          <small *ngIf="loginForm.get('password')?.errors?.['minlength']">Password must be at least 8 characters</small>
        </ion-text>
      </div>

      <ion-button
        expand="block"
        type="submit"
        class="ion-margin-top"
        [disabled]="loginForm.invalid">
        <ion-icon slot="start" name="log-in-outline"></ion-icon>
        Login
      </ion-button>
    </form>

    <div class="links-container">
      <ion-button fill="clear" size="small" (click)="goToPasswordReset()">
        Forgot Password?
      </ion-button>

      <div class="register-section">
        <p>Don't have an account?</p>
        <ion-button fill="outline" expand="block" (click)="goToRegister()">
          <ion-icon slot="start" name="person-add-outline"></ion-icon>
          Register
        </ion-button>
      </div>
    </div>
  </div>
</ion-content>
