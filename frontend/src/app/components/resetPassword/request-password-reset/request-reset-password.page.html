<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/login"></ion-back-button>
    </ion-buttons>
    <ion-title class="ion-text-center">Reset Password</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="reset-container">
    <div class="logo-container">
      <img src="../../../../assets/logo.png" alt="SmartRoute Logo" class="app-logo">
      <h2 class="app-name">SmartRoute</h2>
      <h1>Forgot Password?</h1>
      <p>Enter your email to reset your password</p>
    </div>

    <form [formGroup]="resetForm" (ngSubmit)="resetPassword()">
      <ion-item lines="full">
        <ion-input
          labelPlacement="floating"
          type="email"
          formControlName="email"
          autocomplete="email">
          <div slot="label">Email</div>
        </ion-input>
      </ion-item>

      <div class="error-message" *ngIf="resetForm.get('email')?.invalid && resetForm.get('email')?.touched">
        <ion-text color="danger">
          <small *ngIf="resetForm.get('email')?.errors?.['required']">Email is required</small>
          <small *ngIf="resetForm.get('email')?.errors?.['email']">Invalid email format</small>
        </ion-text>
      </div>

      <ion-button
        expand="block"
        type="submit"
        class="ion-margin-top"
        [disabled]="resetForm.invalid">
        <ion-icon slot="start" name="mail-outline"></ion-icon>
        Send Reset Link
      </ion-button>
    </form>

    <div class="links-container">
      <p class="remember-text">Remember your password?</p>
      <ion-button fill="outline" expand="block" (click)="goToLogin()">
        <ion-icon slot="start" name="log-in-outline"></ion-icon>
        Back to Login
      </ion-button>
    </div>
  </div>
</ion-content>
