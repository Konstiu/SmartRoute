<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/friends"></ion-back-button>
    </ion-buttons>
    <ion-title>{{ friendEmail }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <div class="chat-container">
    <!-- Messages list -->
    <div class="messages-list">
      @for (message of messages; track message.conversationMessageId) {
        <div class="message-wrapper"
             [ngClass]="message.direction === 'sent' ? 'own-message' : 'friend-message'">
          <div class="message-bubble">
            <div class="message-text">{{ message.text }}</div>
            <div class="message-meta">
              <small class="device-id">Device: {{ message.senderDeviceId }}</small>
              <span class="message-timestamp">{{ formatTime(message.timestamp) }}</span>
            </div>
          </div>
        </div>
      }
    </div>

    <!-- Device info (optional - can be hidden or shown on demand) -->
    <div class="device-info" *ngIf="showDeviceInfo">
      <p><strong>Your device:</strong> {{ myDeviceId }}</p>
      <p><strong>Friend's devices:</strong> {{ friendDevices.join(', ') }}</p>
    </div>
  </div>
</ion-content>

<ion-footer>
  <ion-toolbar>
    <div class="input-container">
      <ion-input
        [(ngModel)]="messageText"
        placeholder="Type a message..."
        class="message-input"
        (keydown.enter)="sendMessage()"
      ></ion-input>
      <ion-button
        (click)="sendMessage()"
        [disabled]="!messageText.trim()"
        class="send-button"
      >
        <ion-icon slot="icon-only" name="send"></ion-icon>
      </ion-button>
    </div>
  </ion-toolbar>
</ion-footer>
