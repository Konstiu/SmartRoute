<ion-header>
  <ion-toolbar>
    <ion-title>Weather Insights</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="dismiss()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">


  <ion-list lines="none">

    <ion-item>
      <ion-label>
        <h3>Temperature</h3>
        <p>{{ temperatureDescription }}</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <h3>Wind Conditions</h3>
        <p>{{ windDescription }}</p>
      </ion-label>
    </ion-item>

    <ion-item>
      <ion-label>
        <h3>Precipitation</h3>
        <p>{{ precipitationDescription }}</p>
      </ion-label>
    </ion-item>

  </ion-list>
</ion-content>
