<ion-header>
  <ion-toolbar>
    <ion-title>Weather Insights</ion-title>
    <ion-buttons slot="end">
      <ion-button fill="clear" (click)="close()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">

  <!-- Summary / Score -->
  <ion-card class="rounded-card summary-card">
    <ion-card-header>
      <div class="summary-header">
        <ion-card-title>Overall</ion-card-title>

        <ion-chip class="score-chip" [outline]="true">
          <ion-icon name="sunny-outline"></ion-icon>
          <ion-label>{{ (weatherScore * 100) | number:'1.0-0' }}/100</ion-label>
        </ion-chip>
      </div>
      <ion-card-subtitle>{{ getWeatherScoreSummary(weatherScore) }}</ion-card-subtitle>
    </ion-card-header>
  </ion-card>

  <!-- Metrics -->
  <ion-card class="rounded-card metrics-card">
    <ion-card-header>
      <ion-card-title>Details</ion-card-title>
    </ion-card-header>

    <ion-card-content>
      <ion-list lines="none" class="metrics-list">
        <ion-item>
          <ion-icon name="thermometer-outline" slot="start"></ion-icon>
          <ion-label>
            <h3>Temperature</h3>
            <p>{{ temperatureText }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="flag-outline" slot="start"></ion-icon>
          <ion-label>
            <h3>Wind</h3>
            <p>{{ windText }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="rainy-outline" slot="start"></ion-icon>
          <ion-label>
            <h3>Precipitation</h3>
            <p>{{ precipitationText }}</p>
          </ion-label>
        </ion-item>

        <ion-item>
          <ion-icon name="sunny-outline" slot="start"></ion-icon>
          <ion-label>
            <h3>UV Index</h3>
            <p>{{ uvText }}</p>
          </ion-label>
        </ion-item>
      </ion-list>
    </ion-card-content>
  </ion-card>

</ion-content>
