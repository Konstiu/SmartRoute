<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Your Training Plan
    </ion-title>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Training Plan</ion-title>
    </ion-toolbar>
  </ion-header>
  <button class="bg-red-500 hover:bg-blue-700 text-white font-bold py-2 px-4 rounded" routerLink="/register">
    Go to Register
  </button>

  <app-explore-container name="Training Plan Page"></app-explore-container>
  <app-map [showLocation]="true"></app-map>
</ion-content>
