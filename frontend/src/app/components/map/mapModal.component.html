<ion-header>
  <ion-toolbar>
    <ion-title>Route</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content>
  <div class="modal-frame" [class.editing]="addPointMode" [attr.data-mode]="mode">

  <!-- Spinner overlay -->
  <div class="map-loading" *ngIf="!isMapReady">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Centering route…</p>
  </div>

  <!-- Search overlay (on top of the map) -->
  <div class="search-overlay" *ngIf="isMapReady">
    <div class="search-bar-wrapper">
      <ion-searchbar
        placeholder="Search location…"
        [value]="searchQuery"
        (ionInput)="onSearchInput($event)"
        (ionClear)="clearSearch()">
      </ion-searchbar>
    </div>

    <ion-list *ngIf="searchResults.length > 0" class="search-results">
      <ion-item
        button
        *ngFor="let r of searchResults"
        (click)="selectSearchResult(r)">
        <ion-label class="ion-text-wrap">
          {{ r.display_name }}
        </ion-label>
      </ion-item>
    </ion-list>
  </div>


  <!-- Map -->
  <app-map
    [layers]="localLayers"
    [interactive]="true"
    [addPointMode]="addPointMode"
    (pointAdded)="onPointAdded($event)">
  </app-map>

  <!-- Center FAB -->
  <ion-fab
    vertical="bottom"
    horizontal="end"
    slot="fixed"
    *ngIf="isMapReady">
    <ion-fab-button (click)="centerRoute()">
      <ion-icon name="locate-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

  <!-- LEFT STACKED FABs -->
  <ion-fab vertical="bottom" horizontal="start" slot="fixed">

    <!-- Stops counter -->
    <ion-chip
      *ngIf="isMapReady"
      class="stops-chip"
      [color]="remainingStops === 0 ? 'warning' : 'medium'">
      <ion-icon name="flag-outline"></ion-icon>
      <ion-label>{{ totalStops }}/3 stops</ion-label>
    </ion-chip>

    <!-- Confirm -->
    <ion-fab-button
      *ngIf="addedPoints.length > 0"
      color="success"
      class="fab-confirm"
      [disabled]="isProcessing"
      (click)="confirm()">
      <ion-icon name="checkmark-outline"></ion-icon>
    </ion-fab-button>

    <!-- Mode toggle (only when adding stops) -->
    <ion-fab-button
      *ngIf="isMapReady && addPointMode"
      class="fab-mode"
      [color]="mode === 'KEEP_SHAPE' ? 'tertiary' : 'secondary'"
      (click)="toggleMode()">

      <!-- Icon changes with mode -->
      <ion-icon [name]="mode === 'KEEP_SHAPE' ? 'flash-outline' : 'resize-outline'"></ion-icon>

    </ion-fab-button>


    <!-- Add / Cancel -->
    <ion-fab-button
      [color]="addPointMode ? 'danger' : 'primary'"
      [disabled]="!addPointMode && remainingStops === 0"
      (click)="toggleAddPointMode()">
      <ion-icon [name]="addPointMode ? 'close-outline' : 'add-outline'"></ion-icon>
    </ion-fab-button>

    <ion-fab-button
      *ngIf="isMapReady"
      color="light"
      [disabled]="isProcessing || !onReset"
      (click)="reset()">
      <ion-icon name="refresh-outline"></ion-icon>
    </ion-fab-button>


  </ion-fab>

  </div>
</ion-content>
