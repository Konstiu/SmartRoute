<ion-header>
  <ion-toolbar>
    <ion-title>Route</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="close()">Close</ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content fullscreen>

  <!-- Spinner overlay -->
  <div class="map-loading" *ngIf="!isMapReady">
    <ion-spinner name="crescent"></ion-spinner>
    <p>Centering route…</p>
  </div>

  <!-- Map -->
  <app-map
    [showLocation]="false"
    [interactive]="true"
    [layers]="layers">
  </app-map>

  <!-- Center FAB -->
  <ion-fab
    vertical="bottom"
    horizontal="end"
    slot="fixed"
    *ngIf="isMapReady">
    <ion-fab-button (click)="centerRoute()">
      <ion-icon name="locate-outline"></ion-icon>
    </ion-fab-button>
  </ion-fab>

</ion-content>
