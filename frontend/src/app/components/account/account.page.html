<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Account</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="page-container">

    <ion-header collapse="condense">
      <ion-toolbar>
        <ion-title size="large">Account</ion-title>
      </ion-toolbar>
    </ion-header>

    <!-- Profile Section -->

    <app-user-data-display></app-user-data-display>

    <!-- Connected Services -->
    <ion-card class="rounded-card">
      <ion-card-header>
        <ion-card-title>Connected Services</ion-card-title>
        <ion-card-subtitle>Manage activity syncing</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-button expand="block" fill="outline" (click)="navigateToSync()">
          <ion-icon slot="start" name="sync-outline"></ion-icon>
          Sync Activities
        </ion-button>
      </ion-card-content>
    </ion-card>

    <!-- Health & Injuries -->
    <ion-card class="rounded-card">
      <ion-card-header>
        <ion-card-title>Health & Injuries</ion-card-title>
        <ion-card-subtitle>Track and manage injuries</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-button expand="block" fill="outline" (click)="navigateToInjuries()">
          <ion-icon slot="start" name="medical-outline"></ion-icon>
          Manage Injuries
        </ion-button>
      </ion-card-content>
    </ion-card>

    <!-- Friends -->
     <ion-card class="rounded-card">
      <ion-card-header>
        <ion-card-title>Friends</ion-card-title>
        <ion-card-subtitle>View and manage your friends</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <ion-button expand="block" fill="outline" (click)="navigateToFriends()">
          <ion-icon slot="start" name="people-outline"></ion-icon>
          Manage Friends
        </ion-button>
      </ion-card-content>
    </ion-card>

    <!-- Settings & Actions -->
    <!--ion-card>
      <ion-card-header>
        <ion-card-title>Settings</ion-card-title>
      </ion-card-header>
      <ion-card-content>
        <ion-list lines="none">
          <ion-item button detail="true">
            <ion-icon slot="start" name="settings-outline"></ion-icon>
            <ion-label>Preferences</ion-label>
          </ion-item>
          <ion-item button detail="true">
            <ion-icon slot="start" name="notifications-outline"></ion-icon>
            <ion-label>Notifications</ion-label>
          </ion-item>
          <ion-item button detail="true">
            <ion-icon slot="start" name="help-circle-outline"></ion-icon>
            <ion-label>Help & Support</ion-label>
          </ion-item>
        </ion-list>
      </ion-card-content>
    </ion-card-->
    <ion-card>
      <ion-item button (click)="navigateToKeySync()">
        <ion-icon name="key-outline" slot="start"></ion-icon>
        <ion-label>
          <h2>Sync Encryption Keys</h2>
          <p>Transfer keys to another device</p>
        </ion-label>
        <ion-icon name="chevron-forward" slot="end"></ion-icon>
      </ion-item>
    </ion-card>
    <!-- Logout -->
    <div style="padding: 16px;">
      <ion-button expand="block" color="danger" fill="outline" (click)="presentLogoutConfirm()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Logout
      </ion-button>
    </div>

    <!-- Delete Account -->
    <div style="padding: 16px;">
      <ion-button expand="block" color="danger" fill="outline" (click)="deleteAccount()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Delete Account
      </ion-button>
    </div>

    <!-- Spacing at bottom -->
    <div style="height: 20px;"></div>
  </div>
</ion-content>
