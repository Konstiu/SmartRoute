<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>
      Account
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">Account</ion-title>
    </ion-toolbar>
  </ion-header>

  <app-explore-container name="Account page"></app-explore-container>

  <ion-card>
    <ion-card-content>
      <ion-button expand="block" type="button" (click)="editUserData()">
        <ion-icon slot="start" name="person-outline"></ion-icon>
        Edit user data
      </ion-button>
    </ion-card-content>
  </ion-card>


  <app-connect-strava></app-connect-strava>

  <app-connect-garmin></app-connect-garmin>

  <ion-card>
    <ion-card-content>
      <ion-button expand="block" color="danger" (click)="presentLogoutConfirm()">
        <ion-icon slot="start" name="log-out-outline"></ion-icon>
        Logout
      </ion-button>
    </ion-card-content>
  </ion-card>
  
</ion-content>
