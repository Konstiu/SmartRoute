<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/account"></ion-back-button>
    </ion-buttons>
    <ion-title>Sync Activities</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <div class="sync-container">
    <!-- Connected Services -->
    <ion-card class="sync-card">
      <ion-card-header>
        <ion-card-title>Connected Services</ion-card-title>
        <ion-card-subtitle>Connect your fitness platforms</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <app-connect-strava class="service-narrow"></app-connect-strava>
        <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--divider-color);">
        <app-connect-garmin class="service-narrow"></app-connect-garmin>
      </ion-card-content>
    </ion-card>

    <!-- Spacing at bottom -->
    <div style="height: 20px;"></div>
  </div>

</ion-content>
