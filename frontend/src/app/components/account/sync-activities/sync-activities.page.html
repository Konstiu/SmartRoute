<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/tabs/account"></ion-back-button>
    </ion-buttons>
    <ion-title>Sync Activities</ion-title>
  </ion-toolbar>
</ion-header>
<ion-content [fullscreen]="true">
  <div class="sync-container">
    <!-- Sync Activities Card -->
    @if (hasAnyServiceConnected) {
      <ion-card class="sync-card">
        <ion-card-header>
          <ion-card-title>Sync Activities</ion-card-title>
          <ion-card-subtitle>Import recent activities from connected services</ion-card-subtitle>
        </ion-card-header>
        <ion-card-content>
          <ion-item lines="none">
            <ion-label position="stacked">Number of Activities</ion-label>
            <ion-input
              type="number"
              [(ngModel)]="activitiesToSync"
              placeholder="10"
              min="1"
              max="100">
            </ion-input>
          </ion-item>
          <ion-button
            expand="block"
            (click)="syncActivities()">
            <ion-icon slot="start" name="sync-outline"></ion-icon>
            Sync Activities
          </ion-button>
        </ion-card-content>
      </ion-card>
    }
    <!-- Connected Services -->
    <ion-card class="sync-card">
      <ion-card-header>
        <ion-card-title>Connected Services</ion-card-title>
        <ion-card-subtitle>Connect your fitness platforms</ion-card-subtitle>
      </ion-card-header>
      <ion-card-content>
        <app-connect-strava class="service-narrow"
                            (connectionChanged)="onStravaConnectionChanged($event)"></app-connect-strava>
        <hr style="margin: 2rem 0; border: none; border-top: 1px solid var(--divider-color);">
        <app-connect-garmin class="service-narrow"
                            (connectionChanged)="onGarminConnectionChanged($event)"></app-connect-garmin>
      </ion-card-content>
    </ion-card>

    <!-- Spacing at bottom -->
    <div style="height: 20px;"></div>
  </div>
</ion-content>
