image: registry.reset.inso-w.at/pub/docker/cypress:latest
variables:
  GIT_STRATEGY: "clone"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2"
  # Custom base image with Java 21 + Python
  CUSTOM_BASE_IMAGE: "registry.reset.inso-w.at/2025ws-ase-pr-group/25ws-ase-pr-inso-05-base-java21-python:latest"

stages:
  - build-base-image
  - test
  - build
  - deploy

# -------- BUILD CUSTOM BASE IMAGE (Java 21 + Python) --------
build-base-image:
  stage: build-base-image
  image: docker:24
  services:
    - docker:24-dind
  before_script:
    - echo "$CI_REGISTRY_PASSWORD" | docker login -u "$CI_REGISTRY_USER" --password-stdin registry.reset.inso-w.at
  script:
    - cd backend
    - |
      cat > Dockerfile.base << 'EOF'
      FROM eclipse-temurin:21-jre-jammy
      
      # Install Python 3 and pip
      RUN apt-get update && \
          apt-get install -y --no-install-recommends \
          python3 \
          python3-pip \
          python3-venv && \
          rm -rf /var/lib/apt/lists/*
      
      # Create symbolic link so 'python' command works
      RUN ln -s /usr/bin/python3 /usr/bin/python
      
      # Install Python dependencies globally
      COPY python/requirements.txt /tmp/requirements.txt
      RUN pip3 install --no-cache-dir -r /tmp/requirements.txt && \
          rm /tmp/requirements.txt
      
      WORKDIR /app
      EOF
    - docker build -f Dockerfile.base -t $CUSTOM_BASE_IMAGE .
    - docker push $CUSTOM_BASE_IMAGE
  only:
    changes:
      - backend/python/requirements.txt
      - .gitlab-ci.yml
  when: manual
  allow_failure: true

# -------- BACKEND TEST --------
test-backend:
  stage: test
  image: maven:3-eclipse-temurin-21
  before_script:
    - apt-get update
    - apt-get install -y python3 python3-venv python3-pip 
  script:
    - cd backend
    - mvn -B clean test
  cache:
    paths:
      - backend/.m2/repository

# -------- FRONTEND BUILD --------
frontend-build:
  stage: build
  image: node:24
  script:
    - cd frontend
    - npm install
    - npm run build
    - rm -rf ../backend/src/main/resources/static/*
    - mkdir -p ../backend/src/main/resources/static
    - cp -r www/* ../backend/src/main/resources/static/
  cache:
    paths:
      - frontend/node_modules
  artifacts:
    paths:
      - backend/src/main/resources/static
    expire_in: 1 hour

# -------- BACKEND DOCKER IMAGE BUILD --------
backend-build-image:
  stage: build
  image: maven:3-eclipse-temurin-21
  before_script:
    - apt-get update
    - apt-get install -y python3 python3-venv python3-pip 
  script:
    - cd backend
    - mvn clean package -DskipTests
    - mvn -B jib:build -Djib.from.image=$CUSTOM_BASE_IMAGE -Djib.to.image=registry.reset.inso-w.at/$CI_PROJECT_PATH -Djib.to.tags=$CI_PIPELINE_ID -Djib.to.auth.username=$CI_REGISTRY_USER -Djib.to.auth.password=$CI_REGISTRY_PASSWORD
  needs:
    - frontend-build
  only:
    - master

# -------- DEPLOYMENT --------
deploy:
  stage: deploy
  image: bitnami/kubectl
  script:
    - sed -i 's/:latest/:'"$CI_PIPELINE_ID"'/g' kubernetes.yaml
    - cat kubernetes.yaml
    - kubectl apply -f kubernetes.yaml
  only:
    - master
  needs:
    - backend-build-image
