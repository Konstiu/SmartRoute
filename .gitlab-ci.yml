image: registry.reset.inso-w.at/pub/docker/cypress:latest

variables:
  GIT_STRATEGY: "clone"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2"

stages:
  - test
  - build-base
  - build
  - deploy

# -------- BACKEND TEST --------
test-backend:
  stage: test
  image: maven:3-eclipse-temurin-21
  before_script:
    - apt-get update
    - apt-get install -y python3 python3-venv python3-pip 
  script:
    - cd backend
    - mvn -B clean test
  cache:
    paths:
      - backend/.m2/repository

# -------- FRONTEND BUILD --------
frontend-build:
  stage: build
  image: node:24
  script:
    - cd frontend
    - npm install
    - npm run build
    - rm -rf ../backend/src/main/resources/static/*
    - mkdir -p ../backend/src/main/resources/static
    - cp -r www/* ../backend/src/main/resources/static/
  cache:
    paths:
      - frontend/node_modules
  artifacts:
    paths:
      - backend/src/main/resources/static
    expire_in: 1 hour



build-base-image:
  stage: build-base
  image: docker:27
  services:
    - docker:27-dind
  variables:
    DOCKER_HOST: tcp://docker:2376
    DOCKER_TLS_CERTDIR: "/certs"
  before_script:
    - docker login $CI_REGISTRY -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD
  script:
    - cd backend
    - docker build -f Dockerfile.base -t registry.reset.inso-w.at/$CI_PROJECT_PATH/base:python312 .
    - docker push registry.reset.inso-w.at/$CI_PROJECT_PATH/base:python312
  only:
    - 83-create-python-and-java-docker-image
    - master

# -------- BACKEND DOCKER IMAGE BUILD --------
backend-build-image:
  stage: build
  image: maven:3-eclipse-temurin-21
  before_script:
    - apt-get update
    - apt-get install -y python3 python3-venv python3-pip 
  script:
    - cd backend
    - mvn clean package -DskipTests
    - mvn -B jib:build -Djib.to.image=registry.reset.inso-w.at/$CI_PROJECT_PATH -Djib.to.tags=$CI_PIPELINE_ID -Djib.to.auth.username=$CI_REGISTRY_USER -Djib.to.auth.password=$CI_REGISTRY_PASSWORD
  needs:
    - frontend-build
    - build-base-image
  only:
    - 83-create-python-and-java-docker-image
    - master

# -------- DEPLOYMENT --------
deploy:
  stage: deploy
  image: bitnami/kubectl
  script:
    - sed -i 's/:latest/:'"$CI_PIPELINE_ID"'/g' kubernetes.yaml
    - cat kubernetes.yaml
    - kubectl apply -f kubernetes.yaml
  only:
    - master
  needs:
    - backend-build-image
