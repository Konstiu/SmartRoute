image: registry.reset.inso-w.at/pub/docker/cypress:latest

variables:
  GIT_STRATEGY: "clone"
  MAVEN_OPTS: "-Dmaven.repo.local=.m2"

stages:
  - test
  - build
  - deploy

# -------- BACKEND TEST --------
test-backend:
  stage: test
  image: maven:3-eclipse-temurin-21
  before_script:
    - apt-get update
    - apt-get install -y python3 python3-venv python3-pip 
  script:
    - cd backend
    - mvn -B clean test
  cache:
    paths:
      - backend/.m2/repository

# -------- FRONTEND BUILD --------
frontend-build:
  stage: build
  image: node:24
  script:
    - cd frontend
    - npm install
    - npm run build
    - rm -rf ../backend/src/main/resources/static/*
    - mkdir -p ../backend/src/main/resources/static
    - cp -r www/* ../backend/src/main/resources/static/
  cache:
    paths:
      - frontend/node_modules
  artifacts:
    paths:
      - backend/src/main/resources/static
    expire_in: 1 hour

# -------- BACKEND DOCKER IMAGE BUILD --------
backend-build-image:
  stage: build
  image: 
    name: registry.reset.inso-w.at/pub/docker/moby/buildkit:rootless
    entrypoint: [""]
  variables:
    BUILDKITD_FLAGS: --oci-worker-no-process-sandbox
  before_script:
    - mkdir -p ~/.docker
    - echo "{\"auths\":{\"registry.reset.inso-w.at\":{\"username\":\"$CI_REGISTRY_USER\",\"password\":\"$CI_REGISTRY_PASSWORD\"}}}" > ~/.docker/config.json
  script:
    - |
      buildctl-daemonless.sh build \
        --frontend dockerfile.v0 --local context=$CI_PROJECT_DIR/backend --local dockerfile=$CI_PROJECT_DIR/backend  --output type=image,name=registry.reset.inso-w.at/$CI_PROJECT_PATH:$CI_PIPELINE_ID,push=true
  needs:
    - frontend-build
  only:
    - master

# -------- DEPLOYMENT --------
deploy:
  stage: deploy
  image: bitnami/kubectl
  script:
    - sed -i 's/:latest/:'"$CI_PIPELINE_ID"'/g' kubernetes.yaml
    - cat kubernetes.yaml
    - kubectl apply -f kubernetes.yaml
  only:
    - master
  needs:
    - backend-build-image
