apiVersion: apps/v1
kind: Deployment
metadata:
  name: smart-route
  namespace: 25ws-ase-pr-inso-05
spec:
  selector:
    matchLabels:
      app: smart-route
  replicas: 1
  template:
    metadata:
      labels:
        app: smart-route
    spec:
      containers:
        - name: smart-route-container
          image: registry.reset.inso-w.at/25ws-ase-pr-inso-05/smart-route:latest
          resources:
            requests:
              memory: "128Mi"
              cpu: "10m"
              ephemeral-storage: "100Mi"
            limits:
              memory: "280Mi"
              cpu: "500m"
              ephemeral-storage: "100Mi"
          ports:
            - containerPort: 8080
          livenessProbe:
            httpGet:
              port: 8080
              path: /health
            initialDelaySeconds: 3
            periodSeconds: 3
          readinessProbe:
            httpGet:
              port: 8080
              path: /health
            initialDelaySeconds: 3
            periodSeconds: 3
          startupProbe:
            httpGet:
              port: 8080
              path: /health
            initialDelaySeconds: 3
            periodSeconds: 5
            failureThreshold: 120
          lifecycle:
            preStop:
              httpGet:
                port: 8080
                path: /health/prepareShutdown
      imagePullSecrets:
        - name: secret-dockercfg
  revisionHistoryLimit: 2
  strategy:
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 2
---
apiVersion: v1
kind: Service
metadata:
  name: s-smart-route-service
  namespace: 25ws-ase-pr-inso-05
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app: smart-route
  ports:
    - port: 8080
      protocol: TCP
      targetPort: 8080
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: smart-route-ingress
  namespace: 25ws-ase-pr-inso-05
  annotations:
    nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
    - host: "smart-route.apps.student.inso-w.at"
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: s-smart-route-service
                port:
                  number: 8080
